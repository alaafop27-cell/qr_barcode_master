name: Create upload keystore (run ONCE)

# Creates the signing key used to upload the app to Google Play.
# The key is stored in the repo ENCRYPTED with the secret ANDROID_KEYSTORE_PASSWORD
# (android-signing/upload-keystore.enc). Without that password it is useless.
# Never run this twice: a new key would not match the one registered in Google Play.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create and encrypt the keystore
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -f android-signing/upload-keystore.enc ]; then
            echo "::error::A keystore already exists in the repo. Not creating a new one. (Delete android-signing/upload-keystore.enc yourself ONLY if you really want a different key.)"
            exit 1
          fi
          if ! [[ "$KS_PASS" =~ ^[A-Za-z0-9]{16,}$ ]]; then
            echo "::error::Secret ANDROID_KEYSTORE_PASSWORD is missing, or is not 16+ characters made only of English letters and digits."
            exit 1
          fi
          mkdir -p android-signing
          keytool -genkeypair -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/upload-keystore.jks" \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=QR Barcode Master, OU=Mobile, O=QR Master, C=EG"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$RUNNER_TEMP/upload-keystore.jks" \
            -out android-signing/upload-keystore.enc -pass env:KS_PASS
          # Round-trip test: decrypt again and open it with the password.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android-signing/upload-keystore.enc \
            -out "$RUNNER_TEMP/check.jks" -pass env:KS_PASS
          keytool -list -keystore "$RUNNER_TEMP/check.jks" -storepass "$KS_PASS" | grep -E "Keystore type|upload"

      - name: Commit the encrypted keystore to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-signing/upload-keystore.enc
          git commit -m "Add encrypted upload keystore"
          git push

      - name: Keep an encrypted backup copy
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup-encrypted
          path: android-signing/upload-keystore.enc
