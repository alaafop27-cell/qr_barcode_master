name: Build Release APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true

      - name: Generate Android platform files
        run: |
          mkdir -p "$RUNNER_TEMP/backup"
          cp -r lib "$RUNNER_TEMP/backup/lib"
          cp pubspec.yaml "$RUNNER_TEMP/backup/pubspec.yaml"
          flutter create --platforms=android --org com.qrmaster --project-name qr_barcode_master .
          rm -rf lib test
          cp -r "$RUNNER_TEMP/backup/lib" lib
          cp "$RUNNER_TEMP/backup/pubspec.yaml" pubspec.yaml

      - name: Patch Android project (permissions, minSdk, optional AdMob ID)
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: python3 tool/patch_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=ADMOB_APP_ID="${{ vars.ADMOB_APP_ID }}" \
            --dart-define=ADMOB_BANNER_ID="${{ vars.ADMOB_BANNER_ID }}" \
            --dart-define=ADMOB_INTERSTITIAL_ID="${{ vars.ADMOB_INTERSTITIAL_ID }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QR-Barcode-Master-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
